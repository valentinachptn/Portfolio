<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet Jana Web | Valentina Chapoton</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="project-detail-page">

    <!-- NAVIGATION -->
    <nav class="main-nav">
        <a href="projets.html" class="back-link">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Retour aux projets
        </a>
    </nav>

    <!-- HEADER DU PROJET -->
    <header class="project-header">
        <h1 class="font-title">Jana Web</h1>
        <p class="project-subtitle">Refonte site internet</p>
    </header>

        <!-- BENTO GRID -->
    <section class="bento-grid">
        
        <!-- Bloc 1 : Image (Ajout de bento-no-padding) -->
        <div class="bento-item bento-large bg-pink bento-no-padding">
            <img class="bento-img" src="assets/janaweb-projets-horizontal.png" alt="Mockup logo Jana Web principal">
        </div>

        <!-- Bloc 2 : Image (Ajout de bento-no-padding) -->
        <div class="bento-item bento-tall bg-dark text-white bento-no-padding">
            <img class="bento-img" src="assets/mockup-janaweb-projet.png" alt="Version verticale">
        </div>

        <!-- Bloc 3 : Typographie -->
        <div class="bento-item bg-blue">
            <h3 class="gilroy-bold" style="font-size: 1.5rem; margin-bottom: 1rem;">Typographie</h3>
            <p class="large-type gilroy-bold" style="font-size: 2.5rem;">Gilroy Bold</p>
        </div>

        <!-- Bloc 4 : Texte -->
        <div class="bento-item bg-light project-text">
            <!-- La classe font-title a été remplacée par gilroy-bold ! -->
            <h3 class="gilroy-bold" style="margin-bottom: 1rem; color: var(--primary-blue); font-size: 2rem;">Projet</h3>
            <p style="margin-bottom: 2rem; color: var(--text-gray); line-height: 1.6;">
                Projet réalisé lors de mon alternance chez Jana Web, visant à refondre leur site internet pour correspondre à leur nouvelle direction artistique.
            </p>
            
            <a href="https://www.jana-agenceweb.com" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                Voir le site
            </a>
        </div>

        <!-- Bloc 5 : Image (Ajout de bento-no-padding) -->
        <div class="bento-item bento-full bg-light bento-no-padding">
            <img class="bento-img" src="assets/RC-horizontal-2.png" alt="Mockup textile Jana Web">
        </div>

    </section>
